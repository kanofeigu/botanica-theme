  <text x="60" y="410" fill="#F5F1E8" font-family="Georgia,serif" font-size="28">Mycorrhizal</text>
  <text x="60" y="445" fill="#C97D5A" font-family="Georgia,serif" font-size="36" font-weight="bold">Networks</text>
  <line x1="60" y1="460" x2="180" y2="460" stroke="#C97D5A" stroke-width="2" opacity="0.8"/>
</svg>
