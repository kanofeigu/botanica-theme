      <stop offset="0%" stop-color="#2E2A24"/>
      <stop offset="100%" stop-color="#1a1816"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#C97D5A" stop-opacity="0.15"/>
