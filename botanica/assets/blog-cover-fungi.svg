    <path d="M150 450 Q250 380 320 420 Q400 460 480 380 Q550 320 650 350"/>
    <path d="M80 350 Q180 280 280 300 Q380 320 450 280 Q550 220 680 260"/>
    <path d="M200 200 Q300 150 400 180 Q500 210 600 170"/>
    <path d="M120 300 Q220 250 350 280 Q420 300 520 260 Q620 220 720 250"/>
  </g>
  <!-- Nodes -->
  <g fill="#C97D5A" opacity="0.6">
    <circle cx="280" cy="340" r="4"/><circle cx="350" cy="420" r="3"/>
    <circle cx="500" cy="330" r="5"/><circle cx="580" cy="390" r="3"/>
    <circle cx="320" cy="280" r="4"/><circle cx="450" cy="280" r="3"/>
    <circle cx="620" cy="280" r="4"/><circle cx="400" cy="200" r="5"/>
