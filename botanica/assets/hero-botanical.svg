<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <!-- Hero decorative botanical illustration — layered plants -->
  <!-- Background frond (fern-like, left) -->
  <g opacity="0.07">
    <path d="M0 400 Q30 300 20 200 Q15 120 5 50" stroke="#2E2A24" stroke-width="2" fill="none"/>
    <path d="M20 200 Q50 180 75 175" stroke="#2E2A24" stroke-width="1.5" fill="none"/>
    <path d="M20 220 Q55 210 80 215" stroke="#2E2A24" stroke-width="1.5" fill="none"/>
    <path d="M20 240 Q50 240 70 250" stroke="#2E2A24" stroke-width="1.5" fill="none"/>
    <path d="M18 180 Q45 155 65 145" stroke="#2E2A24" stroke-width="1.5" fill="none"/>
    <path d="M15 260 Q40 270 55 280" stroke="#2E2A24" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Mid-layer Monstera leaf (right-center, large) -->
  <g opacity="0.09" transform="translate(380, 60)">
    <path d="M0 280
             Q-60 240 -100 180
             Q-120 140 -110 100
             Q-100 60 -80 50
             Q-90 70 -85 90
             Q-75 100 -65 90
             Q-60 70 -50 30
             Q-40 0 -20 -10
             Q0 -20 20 -10
             Q40 0 50 30
             Q60 70 70 100
             Q80 120 100 140
             Q110 160 90 200
             Q60 240 0 280Z"
          fill="#2E2A24"/>
    <line x1="0" y1="280" x2="0" y2="-10" stroke="#2E2A24" stroke-width="1.5" opacity="0.3"/>
  </g>

  <!-- Mid-layer fern (right edge) -->
  <g opacity="0.06">
    <path d="M600 250 Q550 180 560 100 Q565 50 580 0" stroke="#2E2A24" stroke-width="2" fill="none"/>
    <path d="M560 120 Q530 105 510 95" stroke="#2E2A24" stroke-width="1.2" fill="none"/>
    <path d="M562 140 Q535 130 515 125" stroke="#2E2A24" stroke-width="1.2" fill="none"/>
    <path d="M565 160 Q540 155 525 155" stroke="#2E2A24" stroke-width="1.2" fill="none"/>
    <path d="M558 100 Q528 80 505 65" stroke="#2E2A24" stroke-width="1.2" fill="none"/>
    <path d="M555 80 Q522 55 498 38" stroke="#2E2A24" stroke-width="1.2" fill="none"/>
  </g>

  <!-- Small accent dots (like spores / botanical notes) -->
  <g opacity="0.05">
    <circle cx="120" cy="150" r="3" fill="#2E2A24"/>
    <circle cx="145" cy="130" r="2" fill="#2E2A24"/>
    <circle cx="100" cy="170" r="2.5" fill="#2E2A24"/>
    <circle cx="500" cy="180" r="3.5" fill="#2E2A24"/>
    <circle cx="525" cy="160" r="2" fill="#2E2A24"/>
    <circle cx="480" cy="200" r="2.5" fill="#2E2A24"/>
    <circle cx="510" cy="210" r="1.5" fill="#2E2A24"/>
  </g>

  <!-- Foreground accent leaf (bottom left) -->
  <g opacity="0.08" transform="translate(80, 320)">
    <ellipse cx="40" cy="20" rx="50" ry="18" fill="#4A6B4F" transform="rotate(-15 40 20)"/>
    <line x1="0" y1="30" x2="80" y2="10" stroke="#4A6B4F" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- Small vine tendril -->
  <g opacity="0.06">
    <path d="M300 380 Q320 350 340 340 Q360 330 370 345 Q380 360 365 375"
          stroke="#2E2A24" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  </g>
</svg>
