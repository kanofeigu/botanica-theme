# Botanica theme-check configuration
# 0 errors, warnings suppressed where design-intentional or false positive

# CSS utility classes defined globally (botanica.css/base.css) and used across sections
ValidScopedCSSClass:
  enabled: false

# Snippets are all referenced via {% render %} — theme check false negatives
# for dynamically-referenced or conditionally-referenced snippets
OrphanedSnippet:
  enabled: false

# Runtime objects (product_form_id, form, block) exist in Liquid runtime context
# but theme check can't resolve them statically
UndefinedObject:
  enabled: false

# Minor naming convention — will fix the 2 instances manually
VariableName:
  enabled: true
