mutation {
  productVariantUpdate(
    productVariantId: "gid://shopify/ProductVariant/45824982417599"
    variant: {
      price: "29.99"
      compareAtPrice: "39.99"
      sku: "TEST-SKU-001"
      optionValues: [{optionName: "Size", name: "6 inch"}]
      requiresShipping: true
      taxable: true
    }
  ) {
    productVariant { id price sku }
    userErrors { field message }
  }
}
