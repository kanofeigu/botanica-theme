query {
  themes(first: 5, roles: [MAIN]) { nodes { id name role } }
  collectionByHandle(handle: "all-plants") {
    productsCount { count }
    products(first: 24) {
      nodes {
        title
        handle
        status
        totalInventory
        variants(first: 1) { nodes { price inventoryQuantity } }
      }
    }
  }
}
